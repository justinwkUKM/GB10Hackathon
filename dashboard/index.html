<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Red-Team Harness</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131824; --panel2:#1a2130; --line:#232c3f;
    --ink:#e6ebf5; --dim:#8a96ad; --accent:#6ea8ff; --good:#38d39f; --bad:#ff6b6b;
    --warn:#ffcc66; --pending:#3a4458;
    --crit:#ff6b6b; --high:#ff8f5e; --medium:#ffcc66; --low:#7fd0ff; --info:#8a96ad;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:24px;max-width:1200px;margin:0 auto}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:0 0 12px}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
  .score{text-align:center;min-width:120px}
  .score .n{font-size:40px;font-weight:700;line-height:1}
  .score .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  /* pipeline */
  .pipe{display:flex;flex-wrap:wrap;gap:10px}
  .step{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;position:relative}
  .step .nm{font-weight:600;font-size:13px}
  .step .t{font-size:11px;color:var(--dim);margin-top:4px;min-height:14px}
  .step .dot{width:9px;height:9px;border-radius:50%;background:var(--pending);
    position:absolute;top:12px;right:12px}
  .step.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .step.active .dot{background:var(--accent);animation:pulse 1s infinite}
  .step.done .dot{background:var(--good)} .step.fail .dot{background:var(--bad)}
  .step.fail{border-color:var(--bad)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px}
  .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pending)}
  .chip.ok::before{background:var(--good)} .chip.bad::before{background:var(--bad)}
  /* agent cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .id{font-weight:600}
  .card .lvl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .card .verdict{margin-top:10px;font-size:13px;font-weight:600}
  .card.vuln{border-color:var(--bad)} .card.clean{border-color:var(--good)}
  .card.active{border-color:var(--accent)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
  .tag.r{background:rgba(255,107,107,.18);color:var(--bad)}
  .tag.g{background:rgba(56,211,159,.18);color:var(--good)}
  .tag.a{background:rgba(110,168,255,.18);color:var(--accent)}
  /* findings */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .sev{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  .sev.critical{color:var(--crit)} .sev.high{color:var(--high)} .sev.medium{color:var(--medium)}
  .sev.low{color:var(--low)} .sev.info{color:var(--info)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--dim)}
  .map{font-size:11px;color:var(--dim);margin-top:3px}
  .empty{color:var(--dim);padding:10px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .live .d{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.4s infinite}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Red-Team Harness <span class="live" id="live"><span class="d"></span>live</span></h1>
    <div class="sub" id="meta">waiting for a run…</div>
  </div>
  <div class="score">
    <div class="n" id="score">—</div>
    <div class="lbl">resiliency</div>
  </div>
</header>

<div class="panel"><h2>Pipeline</h2><div class="pipe" id="pipe"></div></div>
<div class="panel"><h2>Targets</h2><div class="cards" id="agents"><span class="empty">pending…</span></div></div>
<div class="panel"><h2>Findings</h2><div id="findings"><span class="empty">none yet</span></div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(d){
  $("meta").innerHTML = d.run_id
    ? `run <span class="mono">${esc(d.run_id)}</span> · ${esc(d.repo)} · runtime <span class="mono">runsc</span> · started ${esc(d.started)}`
    : "waiting for a run…";
  $("score").textContent = d.score ?? "—";
  $("score").style.color = d.score == null ? "var(--ink)"
    : d.score >= 80 ? "var(--good)" : d.score >= 50 ? "var(--warn)" : "var(--bad)";

  $("pipe").innerHTML = (d.stages||[]).map(s =>
    `<div class="step ${s.state}"><div class="dot"></div><div class="nm">${esc(s.name)}</div>
     <div class="t">${s.t!=null ? s.t+"s" : ""}</div></div>`).join("");

  const ag = d.agents||[];
  $("agents").innerHTML = ag.length ? ag.map(a => {
    const cls = a.state==="active" ? "active" : a.findings>0 ? "vuln" : a.state==="done" ? "clean" : "";
    let verdict = '<span class="lvl">queued</span>';
    if(a.state==="active") verdict = '<span class="tag a">attacking…</span>';
    else if(a.findings!=null) verdict = a.findings>0
      ? `<span class="tag r">${a.findings} finding${a.findings>1?'s':''}</span>`
      : '<span class="tag g">withstood</span>';
    return `<div class="card ${cls}"><div class="id">${esc(a.id)}</div>
      <div class="lvl">${esc(a.level)}</div>
      <div class="verdict">${verdict}${a.score!=null?` <span class="mono">${a.score}/100</span>`:""}</div></div>`;
  }).join("") : '<span class="empty">pending…</span>';

  const f = d.findings||[];
  $("findings").innerHTML = f.length ? `<table><thead><tr>
      <th>Severity</th><th>Target</th><th>Goal</th><th>Evidence</th></tr></thead><tbody>${
    f.map(x => `<tr>
      <td><span class="sev ${esc(x.severity)}">${esc(x.severity)}</span></td>
      <td class="mono">${esc(x.agent)}</td>
      <td>${esc(x.goal)}<div class="map">${x.mapping?esc([x.mapping.owaspLlm,x.mapping.mitreAtlas,x.mapping.nistRmf].filter(Boolean).join(" · ")):""}</div></td>
      <td><span class="mono">${esc(x.verifier)}</span><br>${esc(x.signal)}</td></tr>`).join("")
    }</tbody></table>` : '<span class="empty">none yet</span>';

  $("live").style.display = d.done ? "none" : "inline-flex";
}

async function poll(){
  try{
    const r = await fetch("./status.json?_="+Date.now(), {cache:"no-store"});
    if(r.ok) render(await r.json());
  }catch(e){/* file not there yet */}
}
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
